name: Gwalawala Daily Maintenance

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Run Supabase maintenance
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/scheduled-maintenance" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"run_date":"'$(date -u +%F)'"}'

      - name: Use Supabase pg_cron when GitHub secrets are not configured
        if: ${{ secrets.SUPABASE_URL == '' || secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          echo "GitHub Supabase credentials are not configured; skipping the duplicate Edge Function invocation."
          echo "The authoritative daily automation runs in Supabase pg_cron."
